# 工作流名称，会显示在 GitHub 仓库的 Actions 页面
name: Sync fork with upstream

on:
  # 定时自动同步
  schedule:
    # 每天北京时间 10:17 自动执行一次
    # 使用 Asia/Shanghai 时区，因此 cron 直接按北京时间计算
    # 避开整点可以减少 GitHub Actions 排队延迟
    - cron: "17 10 * * *"
      timezone: "Asia/Shanghai"

  # 允许在 GitHub Actions 页面点击 Run workflow 手动执行
  workflow_dispatch:

# 允许 GitHub Actions 自带的 GITHUB_TOKEN
# 向当前 fork 仓库写入代码
permissions:
  contents: write

# 防止多个同步任务同时运行
# 如果新任务开始时旧任务还未结束，就取消旧任务
concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    # 固定使用 Ubuntu 24.04
    # 避免 ubuntu-latest 将来迁移系统版本带来变化
    runs-on: ubuntu-24.04

    steps:
      # 同步当前 fork 的默认分支
      #
      # 这个步骤会自动读取当前 fork 的默认分支名称，
      # 因此无论默认分支是 main、master，
      # 还是其他自定义名称，都不需要修改此工作流
      - name: Sync default branch from upstream
        run: |
          # 通过 GitHub API读取当前 fork 的默认分支
          # 可能返回 main、master 或其他分支名称
          DEFAULT_BRANCH=$(gh api "repos/${{ github.repository }}" --jq '.default_branch')

          # 检查是否成功读取到默认分支
          # 如果读取失败，立即停止，避免使用空分支名执行同步
          if [ -z "$DEFAULT_BRANCH" ]; then
            echo "错误：无法读取当前 fork 的默认分支"
            exit 1
          fi

          echo "当前 fork 默认分支：${DEFAULT_BRANCH}"
          echo "开始从上游仓库同步默认分支……"

          # gh repo sync 会自动识别当前 fork 对应的上游仓库
          #
          # ${{ github.repository }} 会自动替换成当前仓库名称，
          # 例如 yourname/project
          #
          # --branch 指定刚才自动读取到的默认分支
          gh repo sync "${{ github.repository }}" --branch "${DEFAULT_BRANCH}"

          echo "默认分支 ${DEFAULT_BRANCH} 同步完成"
        env:
          # GitHub Actions 自动生成的令牌
          # 配合 permissions: contents: write，
          # 用于读取仓库信息并更新当前 fork
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
